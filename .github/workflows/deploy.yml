name: Deploy Frontend (Prod/Staging)

on:
  push:
    branches:
      - prod
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-frontend-plus-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  APP_PATH: /var/www/ATI-smarter-panel-frontend-plus

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: |
          npx eslint . \
            --ignore-pattern "dev-dist/" \
            --ignore-pattern "scripts/" \
            --ignore-pattern "dist/" \
            --ignore-pattern "build/" \
            --ignore-pattern "node_modules/" \
            --rule '@typescript-eslint/ban-ts-comment: off' \
            --rule '@typescript-eslint/no-empty-object-type: off'
      - name: Test
        run: npm run test:run

  build-and-push:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create server.mjs if missing
        run: |
          if [ ! -f server.mjs ]; then
            cat > server.mjs << 'EOF'
          import { createServer } from 'http';
          import { readFile } from 'fs/promises';
          import { extname } from 'path';

          const server = createServer(async (req, res) => {
            if (req.url === '/health') {
              res.writeHead(200, { 'Content-Type': 'text/plain' });
              res.end('OK');
              return;
            }

            try {
              let filePath = '.' + req.url;
              if (filePath === './') filePath = './dist/index.html';
              else filePath = './dist' + req.url;
              const data = await readFile(filePath);
              const ext = extname(filePath);
              let contentType = 'text/html';
              if (ext === '.js') contentType = 'text/javascript';
              else if (ext === '.css') contentType = 'text/css';
              else if (ext === '.json') contentType = 'application/json';
              else if (ext === '.png') contentType = 'image/png';
              else if (ext === '.jpg') contentType = 'image/jpeg';
              res.writeHead(200, { 'Content-Type': contentType });
              res.end(data);
            } catch (err) {
              res.writeHead(404);
              res.end('Not Found');
            }
          });

          const port = process.env.PORT || 3015;
          server.listen(port, () => {
            console.log(`Server running on port ${port}`);
          });
          EOF
          fi

      - name: Prepare image name
        id: prep
        run: echo "repo_lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.prep.outputs.repo_lower }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    environment:
      name: ${{ github.ref_name == 'prod' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'prod' && 'https://app.smarterpanel.cloud' || 'https://appstaging.smarterpanel.cloud' }}

    steps:
      - name: Set deployment config
        id: vars
        shell: bash
        run: |
          echo "repo_lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "container_name=smarter-panel-plus-${{ github.ref_name }}-web" >> "$GITHUB_OUTPUT"
          echo "host_port=3015" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref_name }}" == "prod" ]]; then
            echo "api_url=https://api.smarterpanel.cloud/api" >> "$GITHUB_OUTPUT"
            echo "upload_url=https://api.smarterpanel.cloud/upload" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=https://apistaging.smarterpanel.cloud/api" >> "$GITHUB_OUTPUT"
            echo "upload_url=https://apistaging.smarterpanel.cloud/upload" >> "$GITHUB_OUTPUT"
          fi

      - name: Check VPS reachability
        run: |
          HOST="${{ github.ref_name == 'prod' && secrets.VPS_PROD_HOST || secrets.VPS_STAGING_HOST }}"
          echo "Testing connectivity to $HOST on port 22..."
          if ! timeout 10 bash -c "echo >/dev/tcp/$HOST/22" 2>/dev/null; then
            echo "❌ Cannot reach $HOST:22. The VPS may be down or firewalled."
            exit 1
          fi
          echo "✅ VPS reachable on port 22."

      - name: Validate SSH private key
        run: |
          if [ -z "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" ]; then
            echo "❌ DEPLOY_SSH_PRIVATE_KEY secret is empty or not set."
            exit 1
          fi
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > /tmp/private_key
          chmod 600 /tmp/private_key
          if ! ssh-keygen -l -f /tmp/private_key >/dev/null 2>&1; then
            echo "❌ The SSH private key in DEPLOY_SSH_PRIVATE_KEY is invalid."
            echo "   Ensure it is a valid private key (starting with -----BEGIN ... PRIVATE KEY-----)."
            echo "   Also check that newlines are preserved in the GitHub secret."
            exit 1
          fi
          echo "✅ SSH private key is valid."

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ github.ref_name == 'prod' && secrets.VPS_PROD_HOST || secrets.VPS_STAGING_HOST }}
          username: deployer
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: echo "SSH connection successful."

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ github.ref_name == 'prod' && secrets.VPS_PROD_HOST || secrets.VPS_STAGING_HOST }}
          username: deployer
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          envs: REGISTRY,APP_PATH,VITE_API_URL,VITE_UPLOAD_API_URL
          script_stop: true
          debug: true
          script: |
            set -eu

            TAG="${{ github.ref_name }}"
            REPO_LOWER="${{ steps.vars.outputs.repo_lower }}"
            CONTAINER_NAME="${{ steps.vars.outputs.container_name }}"
            HOST_PORT="${{ steps.vars.outputs.host_port }}"
            FULL_IMAGE="$REGISTRY/$REPO_LOWER:$TAG"
            ENV_FILE="$APP_PATH/.env"
            VITE_API_URL="${{ steps.vars.outputs.api_url }}"
            VITE_UPLOAD_API_URL="${{ steps.vars.outputs.upload_url }}"

            echo "📁 Preparation du répertoire $APP_PATH..."
            mkdir -p "$APP_PATH"

            # Fonction robuste pour mettre à jour ou ajouter une variable (avec awk)
            set_or_add_var() {
              local var="$1"
              local value="$2"
              local file="$3"
              if grep -q "^${var}=" "$file"; then
                sudo awk -v var="$var" -v val="$value" 'BEGIN{FS=OFS="="} $1==var {$2=val; print} $1!=var {print}' "$file" | sudo tee "$file" >/dev/null
              else
                echo "${var}=${value}" | sudo tee -a "$file" >/dev/null
              fi
            }

            echo "📝 Configuration du fichier .env..."
            if [ ! -f "$ENV_FILE" ] || [ ! -s "$ENV_FILE" ]; then
              echo "⚠️  $ENV_FILE est manquant ou vide. Création avec les valeurs de base."
              sudo touch "$ENV_FILE"
              sudo chown $USER:$USER "$ENV_FILE"
              echo "VITE_API_URL=$VITE_API_URL" | sudo tee "$ENV_FILE" >/dev/null
              echo "VITE_UPLOAD_API_URL=$VITE_UPLOAD_API_URL" | sudo tee -a "$ENV_FILE" >/dev/null
              echo "VITE_USE_MOCKS=false" | sudo tee -a "$ENV_FILE" >/dev/null
              echo "VITE_USE_HTTPONLY_COOKIES=false" | sudo tee -a "$ENV_FILE" >/dev/null
            else
              echo "✅ Fichier .env existant. Mise à jour des URLs API..."
              set_or_add_var "VITE_API_URL" "$VITE_API_URL" "$ENV_FILE"
              set_or_add_var "VITE_UPLOAD_API_URL" "$VITE_UPLOAD_API_URL" "$ENV_FILE"
              # S'assurer que les autres variables sont présentes
              grep -q '^VITE_USE_MOCKS=' "$ENV_FILE" || echo "VITE_USE_MOCKS=false" | sudo tee -a "$ENV_FILE" >/dev/null
              grep -q '^VITE_USE_HTTPONLY_COOKIES=' "$ENV_FILE" || echo "VITE_USE_HTTPONLY_COOKIES=false" | sudo tee -a "$ENV_FILE" >/dev/null
            fi

            echo "✅ Contenu final de $ENV_FILE :"
            cat "$ENV_FILE"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
            docker pull "$FULL_IMAGE"

            PORT_OWNER=$(docker ps --filter "publish=$HOST_PORT" --format '{{.Names}}' | head -n 1)
            if [ -n "$PORT_OWNER" ] && [ "$PORT_OWNER" != "$CONTAINER_NAME" ]; then
              echo "Host port $HOST_PORT is already used by $PORT_OWNER. Stopping and removing it."
              docker stop "$PORT_OWNER" >/dev/null 2>&1 || true
              docker rm "$PORT_OWNER" >/dev/null 2>&1 || true
            fi

            docker stop "$CONTAINER_NAME" >/dev/null 2>&1 || true
            docker rm "$CONTAINER_NAME" >/dev/null 2>&1 || true

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "127.0.0.1:$HOST_PORT:$HOST_PORT" \
              --env-file "$ENV_FILE" \
              "$FULL_IMAGE"

            for attempt in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER_NAME")
              echo "Tentative $attempt : statut = $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                docker image prune -f
                echo "✅ Déploiement frontend réussi !"
                exit 0
              fi
              if [ "$STATUS" = "unhealthy" ] || [ "$STATUS" = "exited" ]; then
                break
              fi
              sleep 5
            done

            echo "❌ Le conteneur n'est pas devenu healthy. Logs récents :"
            docker logs --tail 100 "$CONTAINER_NAME"
            exit 1
